[project]
name = "ai-video-localization-worker"
version = "0.1.0"
description = "AI Video Localization Studio — Python AI worker sidecar"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    # starlette pinned to the range fastapi 0.115.* declares
    # (starlette>=0.40,<0.47). starlette 1.x removed the deprecated
    # Router(on_startup=...) kwarg that fastapi 0.115 uses, which broke
    # every FastAPI app/test in this project (3 tests failed until pinned).
    "starlette>=0.40,<0.47",
    "uvicorn>=0.30,<1.0",
    "faster-whisper>=1.1,<2.0",
    # Manifest validation (TASK-016A) validates against schemas/*.schema.json.
    "jsonschema>=4.21,<5",
    # MVP default cloud translation provider (FROZEN ADR §3.3). Imported
    # lazily by GeminiProvider, so it must stay a direct dependency or
    # production translation silently falls back to E_PROVIDER_UNAVAILABLE.
    "google-genai>=1.0,<3.0",
]

[project.optional-dependencies]
# CUDA STT: pip-provided CUDA runtime libs that ctranslate2 needs at inference
# time. Optional by design — without them the worker registers nothing and the
# STT service falls back to CPU (see src/core/cuda_libs.py). Install with:
#   pip install -e "."[cuda]
cuda = [
    "nvidia-cublas-cu12>=12.0,<13",
    "nvidia-cudnn-cu12>=9.0,<10",
    "nvidia-cuda-runtime-cu12>=12.0,<13",
    "nvidia-cuda-nvrtc-cu12>=12.0,<13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["src*"]

