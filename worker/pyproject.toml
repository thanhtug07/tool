[project]
name = "ai-video-localization-worker"
version = "0.1.0"
description = "AI Video Localization Studio — Python AI worker sidecar"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ai: slow AI-dependent tests (run separately)",
]
