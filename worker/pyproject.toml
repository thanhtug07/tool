[project]
name = "ai-video-localization-worker"
version = "0.1.0"
description = "AI Video Localization Studio — Python AI worker sidecar"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "faster-whisper>=1.1,<2.0",
    # Manifest validation (TASK-016A) validates against schemas/*.schema.json.
    "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1.0",
    "datamodel-code-generator>=0.25,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ai'"
markers = [
    "ai: slow AI-dependent tests (run separately)",
]
