[package]
name = "ai-video-localization"
version.workspace = true
edition.workspace = true
description = "AI Video Localization Studio — Tauri Rust core"
default-run = "ai-video-localization"
# Desktop app, not published to crates.io; excluded from cargo-deny license audit (license TBD).
publish = false

[lib]
name = "ai_video_localization_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
# Native file-open dialog for the video import flow (RELEASE-P0-005). Only the
# `dialog` permission is granted to the main window (capabilities/default.json).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# OS-level cryptographic randomness for the per-session worker bearer token (256-bit).
getrandom = "0.2"
# SQLite via rusqlite (chosen in ARCHITECTURE_DECISION.md §2.3 / MASTER_PLAN §17.1).
# `bundled` compiles SQLite from source so the app ships self-contained on Windows.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# SecretStore (TASK-030): API keys go to the OS credential vault (Windows
# Credential Manager) via `keyring` — NEVER the SQLite DB. FIX #8: when the
# credential service is unavailable the save is blocked with a clear error;
# there is deliberately NO encrypted-file / custom-crypto fallback.
keyring = "3"

[dev-dependencies]
